{% comment %}
Linhas de ranking reutilizáveis. Espera `linhas` = [{pos,nome,unidade,pts,n}].
O estilo (.rkx-*) vive no <style> de preventiva_ranking.html, o único incluidor,
já em Material Design 3: linha separada por divisor `outline-variant` (nenhuma
borda em volta), posição em chip tonal com o PAR do nível (cor + on-cor) para
os três primeiros, pontos em `primary` peso 500. O markup não precisou mudar —
só os papéis de cor e a tipografia, que moram no incluidor.
{% endcomment %}
{% if linhas %}
<div class="rkx-rows">
  {% for l in linhas %}
  <div class="rkx-row{% if l.pos <= 3 %} rkx-row--{{ l.pos }}{% endif %}">
    <span class="rkx-row__pos num">{{ l.pos }}</span>
    <div class="rkx-row__id">
      <div class="rkx-row__n">{{ l.nome }}</div>
      <div class="rkx-row__u">{{ l.unidade|default:"—" }}</div>
    </div>
    <span class="rkx-row__pts num">{{ l.pts }} pts</span>
    <span class="rkx-row__nn num">{{ l.n }} prev.</span>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="mkpro-empty mkpro-empty--slim">
  <span class="mkpro-chip mkpro-chip--lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></span>
  <p class="mkpro-empty__title">Nenhum ponto neste recorte</p>
  <p class="mkpro-empty__hint">Cada preventiva concluída soma pontos e aparece nesta lista.</p>
</div>
{% endif %}
